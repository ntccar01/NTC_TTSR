<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- Viewport 設定：禁止使用者縮放 (user-scalable=no) 以模擬原生 App 體驗，並防止 iOS 輸入時畫面放大 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- iOS Web App 專用設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="語音助手">
    
    <!-- Android Chrome 專用設定 -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">

    <title>視障友善語音助手 (VoiceDrive Pro)</title>
    
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 React 和 ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- 引入 Babel 用於解析 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* 自定義樣式調整 */
        body {
            touch-action: manipulation; /* 優化觸控回應，移除雙擊縮放延遲 */
            overscroll-behavior-y: none; /* 防止下拉更新或彈性滾動效果，讓它更像 App */
        }
        /* 隱藏捲軸但保留功能 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* 自定義 range slider 樣式以適應高對比模式 */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #FACC15; /* Yellow-400 */
            cursor: pointer;
            margin-top: -10px;
            border: 2px solid #FFFFFF;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #374151;
            border-radius: 2px;
        }
        
        /* 針對 iOS PWA 模式的頂部安全區域調整 */
        @supports (padding-top: env(safe-area-inset-top)) {
            .safe-top-padding {
                padding-top: env(safe-area-inset-top);
            }
        }
    </style>
</head>
<body class="bg-black text-yellow-400 h-screen w-screen overflow-hidden">
    <div id="root" class="h-full w-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 圖示元件 (Icon Components) ---
        const IconBase = ({ size = 24, className = "", children, ...props }) => (
            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width={size} 
                height={size} 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                strokeWidth="2" 
                strokeLinecap="round" 
                strokeLinejoin="round" 
                className={className}
                {...props}
            >
                {children}
            </svg>
        );

        const Play = (props) => (
            <IconBase {...props}>
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </IconBase>
        );

        const Pause = (props) => (
            <IconBase {...props}>
                <rect x="6" y="4" width="4" height="16"></rect>
                <rect x="14" y="4" width="4" height="16"></rect>
            </IconBase>
        );

        const Square = (props) => (
            <IconBase {...props}>
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            </IconBase>
        );

        const ClipboardPaste = (props) => (
            <IconBase {...props}>
                <path d="M15 2H9a1 1 0 0 0-1 1v2c0 .6.4 1 1 1h6c.6 0 1-.4 1-1V3a1 1 0 0 0-1-1Z"></path>
                <path d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2M16 4h2a2 2 0 0 1 2 2v2M11 14h10"></path>
                <path d="m17 10 4 4-4 4"></path>
            </IconBase>
        );

        const Settings = (props) => (
            <IconBase {...props}>
                <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
                <circle cx="12" cy="12" r="3"></circle>
            </IconBase>
        );

        const Mic = (props) => (
            <IconBase {...props}>
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="23"></line>
                <line x1="8" y1="23" x2="16" y2="23"></line>
            </IconBase>
        );

        const MicOff = (props) => (
            <IconBase {...props}>
                <line x1="1" y1="1" x2="23" y2="23"></line>
                <path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path>
                <path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"></path>
                <line x1="12" y1="19" x2="12" y2="23"></line>
                <line x1="8" y1="23" x2="16" y2="23"></line>
            </IconBase>
        );

        const Trash2 = (props) => (
            <IconBase {...props}>
                <path d="M3 6h18"></path>
                <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
                <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
            </IconBase>
        );

        const Volume2 = (props) => (
            <IconBase {...props}>
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </IconBase>
        );

        // --- 主應用程式 (App Component) ---
        const App = () => {
            // 核心狀態
            const [text, setText] = useState('');
            const [isPlaying, setIsPlaying] = useState(false);
            const [isPaused, setIsPaused] = useState(false);
            const [isListening, setIsListening] = useState(false);
            
            // 設定狀態
            const [rate, setRate] = useState(1);
            const [pitch, setPitch] = useState(1);
            const [voices, setVoices] = useState([]);
            const [selectedVoice, setSelectedVoice] = useState(null);
            const [showSettings, setShowSettings] = useState(false);

            // 語音識別參考
            const recognitionRef = useRef(null);

            // 初始化語音引擎與識別
            useEffect(() => {
                const synth = window.speechSynthesis;
                
                // 1. 載入語音合成 (TTS)
                const loadVoices = () => {
                    let availableVoices = synth.getVoices();
                    availableVoices = availableVoices.sort((a, b) => {
                        const aLang = a.lang.includes('zh') || a.lang.includes('TW');
                        const bLang = b.lang.includes('zh') || b.lang.includes('TW');
                        return bLang - aLang;
                    });
                    setVoices(availableVoices);
                    if (availableVoices.length > 0) {
                        const defaultVoice = availableVoices.find(v => v.lang === 'zh-TW') || availableVoices.find(v => v.lang.includes('zh')) || availableVoices[0];
                        setSelectedVoice(defaultVoice);
                    }
                };

                // 部分瀏覽器(如Chrome)需要事件觸發載入
                loadVoices();
                if (synth.onvoiceschanged !== undefined) {
                    synth.onvoiceschanged = loadVoices;
                }
                
                // 定時重試確保 voices 載入 (針對某些 Android 設備)
                const intervalId = setInterval(() => {
                    if (voices.length === 0) loadVoices();
                }, 1000);
                setTimeout(() => clearInterval(intervalId), 5000);


                // 2. 初始化語音識別 (STT)
                // 注意：在非 HTTPS 環境下，此功能可能會被瀏覽器阻擋
                if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                    recognitionRef.current = new SpeechRecognition();
                    recognitionRef.current.continuous = false; // 講完一句自動停止，避免長時間開啟麥克風耗電或錯誤
                    recognitionRef.current.interimResults = false;
                    recognitionRef.current.lang = 'zh-TW';

                    recognitionRef.current.onresult = (event) => {
                        const transcript = event.results[0][0].transcript;
                        setText(prev => prev + transcript); 
                        speakFeedback(`已輸入：${transcript}`);
                        setIsListening(false);
                    };

                    recognitionRef.current.onerror = (event) => {
                        console.error(event.error);
                        // 簡化錯誤提示
                        if (event.error === 'not-allowed') {
                            speakFeedback("請允許麥克風權限");
                        } else if (event.error === 'network') {
                            speakFeedback("網路連線問題");
                        } else {
                            speakFeedback("無法辨識");
                        }
                        setIsListening(false);
                    };
                    
                    recognitionRef.current.onend = () => {
                        setIsListening(false);
                    };
                }

                return () => {
                    synth.cancel();
                    clearInterval(intervalId);
                };
            }, [voices.length]); // 加入依賴以確保更新

            // 系統語音回饋
            const speakFeedback = (msg) => {
                const synth = window.speechSynthesis;
                synth.cancel(); 
                const u = new SpeechSynthesisUtterance(msg);
                u.rate = 1.3; // 回饋語稍微快一點
                if (selectedVoice) u.voice = selectedVoice;
                synth.speak(u);
            };

            // 播放控制邏輯
            const handlePlay = () => {
                const synth = window.speechSynthesis;

                if (isPaused) {
                    synth.resume();
                    setIsPaused(false);
                    setIsPlaying(true);
                    speakFeedback("繼續");
                    return;
                }

                if (synth.speaking) {
                    handlePause();
                    return;
                }

                if (text.trim() === '') {
                    speakFeedback("沒有內容");
                    return;
                }

                synth.cancel();
                const newUtterance = new SpeechSynthesisUtterance(text);
                newUtterance.rate = rate;
                newUtterance.pitch = pitch;
                if (selectedVoice) newUtterance.voice = selectedVoice;

                newUtterance.onstart = () => {
                    setIsPlaying(true);
                    setIsPaused(false);
                };

                newUtterance.onend = () => {
                    setIsPlaying(false);
                    setIsPaused(false);
                };

                newUtterance.onerror = () => {
                    setIsPlaying(false);
                    setIsPaused(false);
                };

                synth.speak(newUtterance);
            };

            const handlePause = () => {
                const synth = window.speechSynthesis;
                if (synth.speaking) {
                    synth.pause();
                    setIsPaused(true);
                    setIsPlaying(false);
                    speakFeedback("暫停");
                }
            };

            const handleStop = () => {
                const synth = window.speechSynthesis;
                synth.cancel();
                setIsPlaying(false);
                setIsPaused(false);
                speakFeedback("停止");
            };

            const handlePaste = async () => {
                try {
                    // 嘗試使用現代 Clipboard API
                    const textFromClipboard = await navigator.clipboard.readText();
                    setText(textFromClipboard);
                    speakFeedback("已貼上");
                } catch (err) {
                    // 如果 HTTPS 限制導致失敗，嘗試提示使用者
                    console.error("Paste failed", err);
                    speakFeedback("無法自動貼上，請手動長按輸入框貼上");
                }
            };

            const handleClear = () => {
                setText('');
                handleStop();
                speakFeedback("清空");
            };

            const toggleListening = () => {
                if (isListening) {
                    recognitionRef.current?.stop();
                    setIsListening(false);
                    speakFeedback("停止");
                } else {
                    if (recognitionRef.current) {
                        try {
                            recognitionRef.current.start();
                            setIsListening(true);
                            speakFeedback("請說話");
                        } catch(e) {
                            console.error(e);
                            speakFeedback("啟動錯誤");
                            setIsListening(false);
                        }
                    } else {
                        speakFeedback("此瀏覽器不支援語音輸入");
                    }
                }
            };

            return (
                <div className="h-full bg-black text-yellow-400 flex flex-col font-sans safe-top-padding">
                    <h1 className="sr-only">視障輔助語音朗讀器</h1>

                    {/* Header */}
                    <header className="p-3 border-b-2 border-yellow-600 flex justify-between items-center bg-gray-900 shrink-0">
                        <div className="flex items-center gap-2" aria-hidden="true">
                            <Volume2 size={28} className="text-yellow-400" />
                            <span className="text-xl font-bold tracking-wider">語音助手</span>
                        </div>
                        <button 
                            onClick={() => {
                                if(!showSettings) speakFeedback("設定");
                                else speakFeedback("關閉");
                                setShowSettings(!showSettings);
                            }}
                            className="p-3 rounded-full bg-yellow-400 text-black font-bold hover:bg-yellow-300 focus:ring-4 focus:ring-white transition"
                            aria-label={showSettings ? "關閉設定" : "開啟設定"}
                        >
                            <Settings size={24} />
                        </button>
                    </header>

                    {/* Main Content */}
                    <main className="flex-1 flex flex-col p-2 w-full max-w-3xl mx-auto relative overflow-hidden">
                        
                        {/* Settings Overlay */}
                        {showSettings && (
                            <div className="absolute inset-0 z-50 bg-gray-900 p-4 flex flex-col gap-4 animate-in fade-in slide-in-from-bottom-10">
                                <h2 className="text-xl font-bold text-white border-b border-gray-700 pb-2">播放設定</h2>
                                
                                <div className="space-y-4 overflow-y-auto flex-1">
                                    <div>
                                        <label className="block text-lg font-bold mb-2 text-white">語音選擇</label>
                                        <select 
                                            className="w-full bg-black text-yellow-400 p-3 text-lg border-2 border-yellow-400 rounded-lg focus:outline-none focus:ring-4 focus:ring-white"
                                            onChange={(e) => {
                                                const voice = voices.find(v => v.name === e.target.value);
                                                setSelectedVoice(voice);
                                                const u = new SpeechSynthesisUtterance("測試");
                                                if(voice) u.voice = voice;
                                                window.speechSynthesis.cancel();
                                                window.speechSynthesis.speak(u);
                                            }}
                                            value={selectedVoice?.name || ''}
                                        >
                                            {voices.map((v) => (
                                                <option key={v.name} value={v.name}>{v.name}</option>
                                            ))}
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-lg font-bold mb-2 text-white">語速: {rate}</label>
                                        <div className="flex items-center gap-3">
                                            <button onClick={() => setRate(Math.max(0.5, rate - 0.1))} className="p-3 bg-gray-800 text-white rounded text-xl font-bold w-12" aria-label="減慢">-</button>
                                            <input 
                                            type="range" min="0.5" max="3" step="0.1" 
                                            value={rate} 
                                            onChange={(e) => setRate(parseFloat(e.target.value))}
                                            className="flex-1 accent-yellow-400 h-6 bg-gray-700 rounded-lg touch-none"
                                            aria-label="語速調整"
                                            />
                                            <button onClick={() => setRate(Math.min(3, rate + 0.1))} className="p-3 bg-gray-800 text-white rounded text-xl font-bold w-12" aria-label="加快">+</button>
                                        </div>
                                    </div>
                                </div>
                                
                                <button 
                                    onClick={() => { setShowSettings(false); speakFeedback("完成"); }}
                                    className="mt-2 w-full py-4 bg-yellow-400 text-black text-xl font-bold rounded-xl hover:bg-yellow-300"
                                >
                                    確認並返回
                                </button>
                            </div>
                        )}

                        {/* Top Area: Text Input */}
                        <div className="flex-[3] flex flex-col gap-2 relative min-h-0">
                            <div className="absolute top-2 right-2 z-10 flex gap-2">
                                {text && (
                                    <button 
                                        onClick={handleClear}
                                        className="p-2 bg-red-600 text-white rounded-lg font-bold shadow-lg border-2 border-white focus:ring-4 focus:ring-yellow-400"
                                        aria-label="清空文字"
                                    >
                                        <Trash2 size={24} />
                                    </button>
                                )}
                            </div>
                            
                            <textarea 
                                className="w-full h-full bg-gray-900 border-2 border-gray-700 rounded-xl p-4 text-2xl font-bold leading-relaxed resize-none focus:outline-none focus:border-yellow-400 focus:ring-2 focus:ring-yellow-400 text-white placeholder-gray-500"
                                placeholder="文字顯示區..."
                                value={text}
                                onChange={(e) => setText(e.target.value)}
                                aria-label="輸入或顯示的文字"
                            />
                        </div>
                        
                        {/* Input Actions Bar - Fixed Height */}
                        <div className="grid grid-cols-2 gap-3 h-20 mt-2 shrink-0">
                            <button 
                                onClick={handlePaste}
                                className="bg-gray-800 hover:bg-gray-700 border-2 border-yellow-600 rounded-xl flex items-center justify-center gap-2 active:bg-yellow-400 active:text-black transition-colors focus:ring-4 focus:ring-white"
                                aria-label="貼上"
                            >
                                <ClipboardPaste size={28} />
                                <span className="text-xl font-bold">貼上</span>
                            </button>

                            <button 
                                onClick={toggleListening}
                                className={`border-2 rounded-xl flex items-center justify-center gap-2 transition-colors focus:ring-4 focus:ring-white ${
                                    isListening 
                                    ? 'bg-red-600 text-white border-white animate-pulse' 
                                    : 'bg-gray-800 text-yellow-400 border-yellow-600 hover:bg-gray-700'
                                }`}
                                aria-label={isListening ? "停止聆聽" : "語音輸入"}
                            >
                                {isListening ? <MicOff size={28} /> : <Mic size={28} />}
                                <span className="text-xl font-bold">{isListening ? "聆聽中" : "說話"}</span>
                            </button>
                        </div>

                        {/* Bottom Area: Playback Controls - Fixed Height */}
                        <div className="h-32 mt-3 flex gap-3 shrink-0 pb-1">
                            <button 
                                onClick={handleStop}
                                className="w-1/3 bg-gray-800 border-2 border-red-500 text-red-500 rounded-xl flex flex-col items-center justify-center gap-1 hover:bg-gray-700 focus:ring-4 focus:ring-white active:bg-red-600 active:text-white transition-colors"
                                aria-label="停止"
                            >
                                <Square size={40} fill="currentColor" />
                                <span className="text-xl font-bold">停止</span>
                            </button>

                            <button 
                                onClick={handlePlay}
                                className={`w-2/3 rounded-xl flex flex-col items-center justify-center gap-1 shadow-lg transition-all focus:ring-4 focus:ring-white active:scale-95 border-4 ${
                                    isPlaying 
                                    ? 'bg-yellow-500 text-black border-white' 
                                    : 'bg-yellow-400 text-black border-transparent hover:bg-yellow-300'
                                }`}
                                aria-label={isPlaying ? "暫停" : (isPaused ? "繼續" : "朗讀")}
                            >
                                {isPlaying ? (
                                    <>
                                        <Pause size={56} fill="currentColor" />
                                        <span className="text-3xl font-black">暫停</span>
                                    </>
                                ) : (
                                    <>
                                        <Play size={56} fill="currentColor" />
                                        <span className="text-3xl font-black">{isPaused ? "繼續" : "朗讀"}</span>
                                    </>
                                )}
                            </button>
                        </div>

                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
